name: Build Kurd Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/60837be4-agent-kurd
    paths:
      - 'android/**'
      - 'server.py'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Using preinstalled SDK at $ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "### Gradle build failure details" >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do
              echo "::error title=Gradle build::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit "$result"

      - name: Verify embedded web and Python server assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/server.py'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/index.html'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kurd-Agent-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v0.1.0"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Kurd-Agent.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Kurd Agent Android APK v0.1.0" \
              --notes "Installable debug-signed Android APK. The app does not bundle model weights or an Android inference engine; configure an Ollama-compatible model service in Settings."
          fi
          gh release upload "$tag" release/Kurd-Agent.apk --clobber
