name: Build Kurd Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/60837be4-agent-kurd
    paths:
      - 'android/**'
      - 'server.py'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          echo "Using Android SDK 37 at $ANDROID_HOME"

      - name: Download and verify on-device inference engine
        run: |
          mkdir -p android/app/libs
          curl --fail --location --retry 3 https://github.com/ThalzeronLabs/llama-kotlin/releases/download/v0.3.0/llama-kotlin-0.3.0.aar --output android/app/libs/llama-kotlin-0.3.0.aar
          echo "5a4af6eeaef31d580adbfb1914b117aff5ff3da79fff4012f70d3c3e4b456d16  android/app/libs/llama-kotlin-0.3.0.aar" | sha256sum --check

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Configure stable APK signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KURD_AGENT_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KURD_AGENT_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KURD_AGENT_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            key_path="$RUNNER_TEMP/kurd-agent-signing.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "KURD_AGENT_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "KURD_AGENT_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KURD_AGENT_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing is not configured; this debug APK uses a temporary runner key. Add the KURD_AGENT_KEYSTORE_BASE64, KURD_AGENT_KEYSTORE_PASSWORD, and KURD_AGENT_KEY_ALIAS repository secrets for upgrade-safe APKs."
          fi

      - name: Build installable debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "### Gradle build failure details" >> "$GITHUB_STEP_SUMMARY"
            { grep -E 'FAILURE:|What went wrong:|Execution failed for task|^e: |error:|Could not resolve|Could not find|Unsupported' "$RUNNER_TEMP/gradle-build.log" | tail -n 30 || true; awk '/What went wrong:/{for(i=0;i<12;i++){print; if(getline<=0)exit}}' "$RUNNER_TEMP/gradle-build.log"; tail -n 20 "$RUNNER_TEMP/gradle-build.log"; } | while IFS= read -r line; do
              echo "::error title=Gradle build::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit "$result"

      - name: Verify embedded web and Python server assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/server.py'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/index.html'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kurd-Agent-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download release
        if: steps.signing.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v0.1.0"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Kurd-Agent.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Kurd Agent Android APK v0.1.0" \
              --notes "Installable debug-signed Android APK. Includes llama.cpp-based on-device GGUF inference; model weights are not bundled. Download a model while online in Settings, then use Android Local AI offline. Hugging Face access tokens are optional for public models and required only for gated/private downloads."
          fi
          gh release upload "$tag" release/Kurd-Agent.apk --clobber
          gh release edit "$tag" --notes "Installable Android APK. Includes llama.cpp-based on-device GGUF inference; model weights are not bundled. Download a model while online in Settings, then use Android Local AI offline. Hugging Face tokens are optional for public models and needed only for gated/private downloads."
